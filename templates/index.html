<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>🎓 Student Management System</h1>
    <p>CRUD-Based Web Application — Flask + SQLite</p>
  </header>

  <main>
    <section class="form-card">
      <h2 id="form-title">Add Student</h2>
      <form id="student-form">
        <input type="hidden" id="student-id">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="e.g. Akshara R">
          <span class="error" id="err-name"></span>
        </div>
        <div class="field">
          <label for="roll_no">Roll Number</label>
          <input type="text" id="roll_no" placeholder="e.g. 23ECE045">
          <span class="error" id="err-roll_no"></span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="e.g. student@vsb.edu">
          <span class="error" id="err-email"></span>
        </div>
        <div class="field">
          <label for="department">Department</label>
          <input type="text" id="department" placeholder="e.g. ECE">
          <span class="error" id="err-department"></span>
        </div>
        <div class="field">
          <label for="year">Year</label>
          <input type="number" id="year" min="1" max="5" placeholder="1-5">
          <span class="error" id="err-year"></span>
        </div>
        <div class="field">
          <label for="cgpa">CGPA</label>
          <input type="number" step="0.01" id="cgpa" min="0" max="10" placeholder="e.g. 9.33">
          <span class="error" id="err-cgpa"></span>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Add Student</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
        </div>
        <p id="form-msg" class="msg"></p>
      </form>
    </section>

    <section class="list-card">
      <div class="list-header">
        <h2>Students</h2>
        <input type="text" id="search" placeholder="Search by name, roll no, dept...">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Roll No</th><th>Name</th><th>Email</th><th>Dept</th><th>Year</th><th>CGPA</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-list">
          </tbody>
        </table>
        <p id="empty-state" class="hidden">No students yet. Add one above.</p>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
